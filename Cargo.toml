[package]
name = "glam"
version = "0.33.12"
edition = "2024"
description = "A simple and fast 3D math library for games and graphics"
documentation = "https://docs.rs/glam"
repository = "https://github.com/bitshifter/glam-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
include = [
    "/src/**/*.rs",
    "/tests/**",
    "/benches/*.rs",
    "/benches/support/*.rs",
    "/ATTRIBUTION.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]
keywords = ["gamedev", "math", "matrix", "vector", "quaternion"]
categories = ["game-engines", "no-std"]
rust-version = "1.85.0"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["std", "all-types"]

# enable support for the standard library
std = []

f64 = []
isize = []
usize = []
i64 = []
u64 = []
i32 = []
u32 = []
i16 = []
u16 = []
i8 = []
u8 = []

float-types = ["f64"]
integer-types = ["i8", "u8", "i16", "u16", "i32", "u32", "i64", "u64"]
size-types = ["isize", "usize"]

all-types = ["float-types", "integer-types", "size-types"]

# enable additional glam checks if debug assertions are enabled
debug-glam-assert = []
# always enable additional glam checks
glam-assert = []

# this is primarily for testing the fallback implementation
scalar-math = []

# align types to match CUDA requirements
cuda = []

# Deprecated and no longer has any effect. Kept so existing Cargo manifests
# continue to build; will be removed in a future breaking release.
fast-math = []

serde = ["dep:serde_core"]

# experimental nightly portable-simd support
core-simd = ["bytemuck?/nightly_portable_simd"]

# `rkyv`'s archive validation. Only has an effect when an `rkyv` feature is enabled.
bytecheck = ["rkyv-08?/bytecheck"]

# Unversioned `zerocopy` is deprecated and will be removed in the next major release.
zerocopy = ["zerocopy-08"]
zerocopy-08 = ["dep:zerocopy-08", "dep:zerocopy-derive-08"]

# enables libm and prefers it over std
libm = ["dep:libm"]

# enables libm but will prefer std if available
nostd-libm = ["dep:libm"]

# Unversioned `approx` is deprecated and will be removed in the next major release.
approx = ["approx-05"]
approx-05 = ["dep:approx-05"]

# Unversioned `mint` is deprecated and will be removed in the next major release.
mint = ["mint-05"]
mint-05 = ["dep:mint-05"]

# Unversioned `rand` is deprecated and will be removed in the next major release.
rand = ["rand-010"]
rand-010 = ["dep:rand-010"]

# Unversioned `speedy` is deprecated and will be removed in the next major release.
speedy = ["speedy-08"]
speedy-08 = ["dep:speedy-08"]

# Unversioned `encase` is deprecated and will be removed in the next major release.
encase = ["encase-012"]
encase-012 = ["dep:encase-012"]
encase-013 = ["dep:encase-013"]

# Unversioned `rkyv` is deprecated (unsound) and will be removed in the next major release.
rkyv = ["dep:rkyv-08"]
rkyv-08 = ["dep:rkyv-08"]

[dependencies]
approx-05 = { package = "approx", version = "0.5", optional = true, default-features = false }
# `aarch64_simd` and `wasm_simd` were added in bytemuck 1.9.
bytemuck = { version = "1.9", optional = true, default-features = false, features = ["derive", "aarch64_simd", "wasm_simd"] }
mint-05 = { package = "mint", version = "0.5", optional = true, default-features = false }
rand-010 = { package = "rand", version = "0.10", optional = true, default-features = false }
serde_core = { version = "1", optional = true, default-features = false }
rkyv-08 = { package = "rkyv", version = "0.8", optional = true, default-features = false }
libm = { version = "0.2", optional = true, default-features = false }
speedy-08 = { package = "speedy", version = "0.8", optional = true, default-features = false }
encase-012 = { package = "encase", version = "0.12", optional = true, default-features = false }
encase-013 = { package = "encase", version = "0.13", optional = true, default-features = false }
zerocopy-08 = { package = "zerocopy", version = "0.8", optional = true, default-features = false, features = ["simd"] }
zerocopy-derive-08 = { package = "zerocopy-derive", version = "0.8", optional = true, default-features = false }
arbitrary = { version = "1", default-features = false, optional = true }
float_eq = { version = "1", default-features = false, optional = true }

[dev-dependencies]
# rand_xoshiro is required for tests if rand is enabled.
# It tracks the `rand` version and must match the `rand-NNN` feature under test.
rand_xoshiro = "0.8"
# "alloc" is needed to support to_bytes()/deserialize() in tests.
rkyv-08 = { package = "rkyv", version = "0.8", default-features = false, features = ["alloc"] }
serde_json = "1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
gungraun = "0.20"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3.0"

[lib]
bench = false

[[bench]]
name = "mat2"
harness = false

[[bench]]
name = "mat3"
harness = false

[[bench]]
name = "mat3a"
harness = false

[[bench]]
name = "affine2"
harness = false

[[bench]]
name = "affine3"
harness = false

[[bench]]
name = "mat4"
harness = false

[[bench]]
name = "quat"
harness = false

[[bench]]
name = "support"
bench = false

[[bench]]
name = "vec2"
harness = false

[[bench]]
name = "vec3"
harness = false

[[bench]]
name = "vec3a"
harness = false

[[bench]]
name = "vec4"
harness = false

[[bench]]
name = "gungraun"
harness = false

[workspace]
members = [
    "tools/ci",
    "tools/codegen",
    "tools/test_no_std",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }
