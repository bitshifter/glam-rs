name: Release-plz
on:
  push:
    branches: [main]

jobs:
  # Publish to crates.io and push the git tag when the release PR is merged.
  release-plz-release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'bitshifter' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the git tag
      pull-requests: read # detect the merged release PR
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true # tools/codegen is a workspace member submodule
      - run: rustup update --no-self-update stable
      - run: rustup default stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create or update the "Prepare <version> release" PR.
  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.repository_owner == 'bitshifter' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push commits to the release PR branch
      pull-requests: write # open and update the release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true # tools/codegen is a workspace member submodule
          # Allow pushing the changelog commit to the release PR branch.
          persist-credentials: true
      - run: rustup update --no-self-update stable
      - run: rustup default stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-plz only bumps Cargo.toml and Cargo.lock. Stamp the release
      # version header and compare links into the hand-curated changelog.
      # prs_created is 'true' only when release-plz created or updated a
      # release PR; on pushes with no pending release the `pr` output is
      # '{}' and this step should be skipped.
      - name: Update changelog
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
          REPO_URL: ${{ github.serverUrl }}/${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr checkout "$(echo "$PR" | jq -r '.number')"
          new_ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          prev_ver=$(git tag --list --sort=-version:refname | grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$')
          echo "Stamping changelog for $new_ver (previous release: $prev_ver)"
          python3 .github/scripts/prepare-release.py "$new_ver" "$prev_ver"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelog already up to date"
          else
            git commit -m "Stamp $new_ver changelog entry"
            git push
          fi
