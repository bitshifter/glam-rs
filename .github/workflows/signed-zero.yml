name: Signed-zero determinism

# Regression guard for scalar-math signed-zero selection.
#
# LLVM issue #93414 caused fcmp+select to be folded to minnum/maxnum, letting
# AArch64 FMINNM/FMAXNM change the sign of zero results. It was fixed in LLVM
# 23 by https://github.com/llvm/llvm-project/pull/210077 and shipped in Rust
# 1.99.0.
#
# This runs weekly and on demand rather than on every PR. It also runs when
# the test or this workflow changes.
on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  push:
    paths:
      - ".github/workflows/signed-zero.yml"
      - "tests/scalar_math_signed_zero.rs"
  pull_request:
    paths:
      - ".github/workflows/signed-zero.yml"
      - "tests/scalar_math_signed_zero.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-zero:
    name: Signed zero (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 control: the scalar comparison semantics are preserved.
          - os: ubuntu-latest
            toolchain: stable
          # AArch64 is where the LLVM fold used FMINNM/FMAXNM.
          - os: ubuntu-24.04-arm
            toolchain: stable
          - os: ubuntu-24.04-arm
            toolchain: beta
          - os: macos-14
            toolchain: stable
          - os: macos-14
            toolchain: beta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - run: rustc +"${{ matrix.toolchain }}" -vV
      - run: >-
          cargo +"${{ matrix.toolchain }}" test --release
          --features scalar-math,libm
          --test scalar_math_signed_zero
