name: Update gungraun baselines
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

env:
  # Keep in sync with BENCH_TOOLCHAIN in bench.yml.
  BENCH_TOOLCHAIN: 1.98.0

jobs:
  save:
    name: save (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The ci tool saves/compares the sse2 and scalar-math baselines on
        # x86_64 Linux and the neon and scalar-math baselines on aarch64
        # Linux. Valgrind doesn't support macOS, so there are no macOS
        # baselines.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/checkout@v7
        with:
          repository: bitshifter/glam-bench-baselines
          path: benches/gungraun-baselines
          token: ${{ secrets.GLAM_BENCH_BASELINES_TOKEN }}
      - name: Remove baselines saved by other runners
        run: |
          find benches/gungraun-baselines -type f -name '*.base@*' -delete
          find benches/gungraun-baselines -type d -empty -delete
      - uses: Swatinem/rust-cache@v2
      - run: rustup update --no-self-update ${{ env.BENCH_TOOLCHAIN }}
      - run: rustup default ${{ env.BENCH_TOOLCHAIN }}
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo run --release -p ci -- bench --save
      - name: Keep only baseline files
        run: |
          find benches/gungraun-baselines -type f ! -name '*.base@*' ! -name 'Cargo.lock' ! -name 'x86_64.md' ! -name 'aarch64.md' -delete
          find benches/gungraun-baselines -type d -empty -delete
      - uses: actions/upload-artifact@v7
        with:
          name: baselines-${{ matrix.os }}
          path: benches/gungraun-baselines
          if-no-files-found: error

  commit:
    name: Commit baselines
    needs: save
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: bitshifter/glam-bench-baselines
          path: baselines
          token: ${{ secrets.GLAM_BENCH_BASELINES_TOKEN }}
      - name: Clear previous baselines
        run: |
          cd baselines
          rm -rf glam Cargo.lock x86_64.md aarch64.md
      - uses: actions/download-artifact@v8
        with:
          pattern: baselines-*
          path: baselines
          merge-multiple: true
      - name: Commit baselines
        run: |
          cd baselines
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no baseline changes"
            exit 0
          fi
          git commit -m "chore: update gungraun baselines from glam-rs@${{ github.sha }}"
          git push
